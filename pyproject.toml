[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tostao-supply-chain"
version = "0.1.0"
description = "Pronóstico de demanda y recomendación de abastecimiento SKU-Tienda"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "statsmodels>=0.14"]

[project.scripts]
tostao-supply = "tostao_supply_chain.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
